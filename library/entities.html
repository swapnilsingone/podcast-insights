<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entities — Podcast Insights</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lib.css">
<style>
.filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
.filter-chip { padding: 8px 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; cursor: pointer; font-size: 12px; font-family: var(--mono); letter-spacing: .04em; text-transform: lowercase; transition: all .15s; }
.filter-chip:hover { color: var(--ink-2); border-color: var(--line-strong); }
.filter-chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 980px) { .ents { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .ents { grid-template-columns: 1fr; } }
.ent { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; cursor: pointer; transition: all .15s; }
.ent:hover { border-color: var(--accent); transform: translateY(-1px); }
.ent.recurring { border-color: rgba(244,192,66,.3); }
.ent.recurring::after { content: "compounding"; display: inline-block; margin-left: 8px; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.ent .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ent .name { font-family: var(--serif); font-size: 17px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
.ent .kind { font-family: var(--mono); font-size: 9px; color: var(--muted-2); letter-spacing: .12em; text-transform: uppercase; }
.ent .role { color: var(--muted); font-size: 12px; margin-top: 4px; font-style: italic; }
.ent .occs { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.ent .occs .b { font-family: var(--mono); font-size: 10px; color: var(--ink-2); padding: 3px 8px; background: var(--bg-2); border-radius: 4px; }
.ent .occs .b strong { color: var(--accent); }
.detail { display: none; padding: 0; margin: 20px 0 32px; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 24px; }
.detail.open { display: block; }
.detail .x { float: right; background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 20px; }
.detail h2 { font-family: var(--serif); font-size: 28px; margin: 0 0 4px; color: var(--ink); }
.detail .role { color: var(--muted); font-style: italic; margin-bottom: 16px; }
.detail .vids { display: flex; flex-direction: column; gap: 8px; }
.detail .vid { padding: 12px 14px; background: var(--bg-2); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.detail .vid .t { font-family: var(--serif); font-size: 14px; color: var(--ink); }
.detail .vid .c { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.detail .vid .ctx { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.detail .vid a { color: var(--accent); font-family: var(--mono); font-size: 11px; }
</style>
</head>
<body>
<div class="container">

<header class="topbar">
  <div class="brand"><a href="./index.html"><span class="dot"></span>Podcast Insights</a></div>
  <nav class="nav">
    <a href="./index.html">Library</a><a href="./dashboard.html">Tracker</a>
    <a href="./entities.html" class="active">Entities</a><a href="./predictions.html">Predictions</a>
    <a href="./speakers.html">Speakers</a><a href="./qa.html">Ask</a>
    <a href="./compare.html">Compare</a><a href="./highlights.html">Highlights</a>
  </nav>
  <button class="icon-btn" id="themeBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</header>

<header class="hero">
  <div class="kicker"><span>Entity index</span></div>
  <h1>The <em>cast</em> of your archive.</h1>
  <p class="lede">Everyone and everything named across your library. Names that appear in multiple videos are highlighted — that's where compounding lives.</p>
</header>

<div class="search" style="margin-bottom: 16px">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  <input id="q" type="text" placeholder="Search people, companies, products, frameworks…" />
</div>

<div class="filters" id="filters"></div>
<div id="detail" class="detail"></div>
<div id="ents" class="ents"></div>

<footer>
  <span id="count"></span>
  <span><a href="./dashboard.html">← back to tracker</a></span>
</footer>
</div>

<script>
let ENTS = [], activeKind = 'all', q = '';
async function load() {
  ENTS = await fetch('./entities.json',{cache:'no-cache'}).then(r=>r.json());
  const kinds = ['all', ...Array.from(new Set(ENTS.map(e => e.kind)))];
  const fEl = document.getElementById('filters');
  fEl.innerHTML = kinds.map(k => `<button class="filter-chip${k==='all'?' active':''}" data-k="${k}">${k.replace('_',' ')}</button>`).join('');
  fEl.querySelectorAll('button').forEach(b => b.onclick = () => {
    activeKind = b.dataset.k;
    fEl.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    render();
  });
  // Hash deep-link
  if (location.hash) showDetail(location.hash.slice(1));
  render();
}
function render() {
  const items = ENTS.filter(e =>
    (activeKind === 'all' || e.kind === activeKind) &&
    (!q || e.name.toLowerCase().includes(q.toLowerCase()))
  );
  document.getElementById('count').textContent = items.length + ' entities';
  document.getElementById('ents').innerHTML = items.map(e => `
    <div class="ent${e.video_count >= 2 ? ' recurring' : ''}" data-slug="${e.slug}" onclick="showDetail('${e.slug}')">
      <div class="h">
        <span class="name">${e.name}</span>
        <span class="kind">${e.kind.replace('_',' ')}</span>
      </div>
      ${e.occurrences[0]?.role ? `<div class="role">${e.occurrences[0].role}</div>` : ''}
      <div class="occs">
        <span class="b"><strong>${e.video_count}</strong> video${e.video_count===1?'':'s'}</span>
        ${e.total_mentions > 1 ? `<span class="b">${e.total_mentions} mentions</span>` : ''}
        ${e.first_uploaded ? `<span class="b">${e.first_uploaded === e.last_uploaded ? e.first_uploaded : `${e.first_uploaded} → ${e.last_uploaded}`}</span>` : ''}
      </div>
    </div>
  `).join('');
}
function showDetail(slug) {
  const e = ENTS.find(x => x.slug === slug);
  if (!e) return;
  const d = document.getElementById('detail');
  d.classList.add('open');
  const spanLine = e.first_uploaded
    ? (e.first_uploaded === e.last_uploaded
        ? `<div class="role">First (and only) mention: ${e.first_uploaded}</div>`
        : `<div class="role">Seen in your library from <strong style="color:var(--accent)">${e.first_uploaded}</strong> to <strong style="color:var(--accent)">${e.last_uploaded}</strong> · span ${e.span_days} days</div>`)
    : '';
  d.innerHTML = `
    <button class="x" onclick="document.getElementById('detail').classList.remove('open')">×</button>
    <h2>${e.name}</h2>
    ${e.occurrences[0]?.role ? `<div class="role">${e.occurrences[0].role}</div>` : ''}
    ${spanLine}
    <div class="vids">
      ${e.occurrences.map(o => `
        <div class="vid">
          <div>
            <div class="c">${o.channel||''} ${o.upload_date ? `· ${o.upload_date}` : ''}</div>
            <div class="t">${o.video_title||''}</div>
            ${o.context ? `<div class="ctx">"${o.context}"</div>` : ''}
          </div>
          <a href="${o.url}" target="_blank" rel="noopener">jump ↗</a>
        </div>
      `).join('')}
    </div>
  `;
  d.scrollIntoView({behavior:'smooth', block:'start'});
}
document.getElementById('q').addEventListener('input', e => { q = e.target.value; render(); });
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
};
load();
</script>
</body>
</html>
